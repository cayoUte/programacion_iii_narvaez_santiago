<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores - Clínica Veterinaria</title>
    <style>
        body {
            background-color: #1e3a34;
        }
        h1 {
            color: white;
        }
        h2 {
            color: #a8e6cf;
        }
        h3 {
            color: rgba(255, 183, 148, 0.9);
        }
        h4 {
            color: rgb(220, 237, 240);
        }
        h5 {
            color: hsl(160, 60%, 80%);
        }
    </style>
</head>
<body>
    <h1>Manual de Identidad Visual - Clínica Veterinaria</h1>
    <h1>Blanco Clínico (Por nombre del color)</h1>
    <h2>Verde Menta (Por valor hexadecimal)</h2>
    <h3>Naranja Cálido (Por valor RGBA)</h3>
    <h4>Azul Serenidad (Por valor RGB)</h4>
    <h5>Verde Salvia (Por valor HSL)</h5>
</body>
</html>
