<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Registro de citas</title>
</head>
<body>


    <header>
        <h1>Clínica Veterinaria Patitas Felices</h1>
        <p>Registro de consultas</p>
    </header>


    <hr>


    <main>


        <form action="#"
              method="get"
              id="registro-citas">


            <fieldset>
                <legend>Información de la cita</legend>


                <label for="codigo">
                    Código de cita:
                </label>


                <input type="text"
                       id="codigo"
                       name="codigo"
                       placeholder="CIT-001"
                       maxlength="10"
                       required>


                <br><br>


                <label for="veterinario">
                    Veterinario:
                </label>


                <select id="veterinario"
                        name="veterinario"
                        required>


                    <option value="">
                        Selecciona un veterinario
                    </option>


                    <option value="martinez">
                        Dr. Martínez
                    </option>


                    <option value="lopez">
                        Dra. López
                    </option>


                    <option value="garcia">
                        Dr. García
                    </option>


                </select>


                <br><br>


                <label for="mascota">
                    Nombre de la mascota:
                </label>


                <input type="text"
                       id="mascota"
                       name="mascota"
                       placeholder="Ej. Firulais"
                       required>


                <br><br>


                <label for="fecha">
                    Fecha de la cita:
                </label>


                <input type="date"
                       id="fecha"
                       name="fecha"
                       required>


            </fieldset>


            <br>


            <fieldset>
                <legend>Características</legend>


                <p>Urgencia de la consulta:</p>


                <input type="radio"
                       id="alta"
                       name="urgencia"
                       value="alta"
                       required>


                <label for="alta">Alta</label>


                <input type="radio"
                       id="media"
                       name="urgencia"
                       value="media">


                <label for="media">Media</label>


                <input type="radio"
                       id="baja"
                       name="urgencia"
                       value="baja">


                <label for="baja">Baja</label>


                <br><br>


                <label for="gravedad">
                    Nivel de gravedad (1 a 10):
                </label>


                <input type="number"
                       id="gravedad"
                       name="gravedad"
                       min="1"
                       max="10"
                       value="5">


                <p>Servicios requeridos:</p>


                <input type="checkbox"
                       id="consulta"
                       name="servicios"
                       value="consulta">


                <label for="consulta">
                    Consulta general
                </label>


                <br>


                <input type="checkbox"
                       id="vacuna"
                       name="servicios"
                       value="vacuna">


                <label for="vacuna">
                    Vacunación
                </label>


                <br>


                <input type="checkbox"
                       id="cirugia"
                       name="servicios"
                       value="cirugia">


                <label for="cirugia">
                    Cirugía
                </label>


            </fieldset>


            <br>


            <fieldset>
                <legend>Descripción de la consulta</legend>


                <label for="descripcion">
                    Motivo de la visita:
                </label>


                <br>


                <textarea id="descripcion"
                          name="descripcion"
                          rows="5"
                          cols="45"
                          maxlength="500"
                          placeholder="Describe los síntomas o motivo..."
                          required></textarea>


            </fieldset>


            <br>


            <button type="submit">
                Registrar cita
            </button>


            <button type="reset">
                Limpiar datos
            </button>


        </form>


    </main>


    <hr>


    <footer>
        <p>
            <small>
                Patitas Felices - 2026
            </small>
        </p>
    </footer>


</body>
</html>
