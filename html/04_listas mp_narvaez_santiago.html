<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas</h1>
    <h2>Listas no ordenadas</h2>
    <!-- Unordered List -->
    <ul>
        <li>Luke Skywalker</li>
        <li>Han Solo</li>
        <li>Leia Organa</li>
        <li>Darth Vader</li>
    </ul>
    <h2>Listas ordenadas</h2>
    <!-- Ordered List -->
    <ol>
        <li>Luke Skywalker</li>
        <li>Han Solo</li>
        <li>Leia Organa</li>
        <li>Darth Vader</li>
    </ol>
</body>
</html>
